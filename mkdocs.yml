site_name: My Portfolio
site_url: https://flamerten.github.io/portfolio/
repo_url: https://github.com/flamerten # direct users to my github page
edit_uri: "" # Hides the "Edit this page" button

theme:
  name: material
  palette: 
      - scheme: default
        primary: navy
        accent: purple 
        toggle:
          icon: material/brightness-7
          name: Switch to dark mode
      - scheme: slate
        primary: navy
        accent: lime
        toggle:
          icon: material/brightness-4
          name: Switch to light mode
  features:
    - navigation.tabs   
    - navigation.top    
    - navigation.indexes
    - content.code.copy 

# Extensions to make your notes look professional
markdown_extensions:
  - attr_list                # For styling images/buttons
  - admonition               # For Obsidian Callouts
  - pymdownx.details         # For collapsible sections
  - pymdownx.superfences     # Essential for nesting code blocks
  - pymdownx.highlight:      # Enhanced Code Highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Your plugins
plugins:
  - search                   # Standard search bar
  - tags                     # Allows filtering projects by tags (e.g., #python, #cpp)
  - pub-obsidian:
      obsidian_dir: .obsidian
      backlinks:
        enabled: false
      callouts:
        enabled: true
        indentation: spaces
      comments:
        enabled: true
        inject_as_html: false
      links:
        wikilinks_enabled: true

# MathJax javascript
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js